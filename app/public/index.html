<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>蜂巢控制台 · 并行派发</title>
<link rel="stylesheet" href="/theme.css">
</head><body><div class="wrap">
<header>
  <div class="hbar">
    <h1>蜂巢控制台<span class="thin" id="wavelbl"> · Wave 1</span></h1>
    <div class="hmeta">
      <span class="hchip"><span class="live"></span>LIVE · 5s</span>
      <span class="hchip" id="clock">--:--:--</span>
      <span class="hchip">派发 <b id="disp">--</b></span>
    </div>
  </div>
  <div class="statsband">
    <div class="stat b-running"><b id="s-running" style="color:var(--st-running)">0</b><span>进行中</span></div>
    <div class="stat b-reported"><b id="s-reported" style="color:var(--st-reported)">0</b><span>待验收</span></div>
    <div class="stat b-accepted"><b id="s-accepted" style="color:var(--st-accepted)">0</b><span>已验收</span></div>
    <div class="stat b-failed"><b id="s-failed" style="color:var(--st-failed)">0</b><span>失败</span></div>
    <div class="stat b-cancelled"><b id="s-cancelled" style="color:var(--st-cancelled)">0</b><span>已取消</span></div>
    <div class="stat barblock">
      <div class="pbar" id="pbar"></div>
      <span class="pct" id="pct">0%</span>
    </div>
  </div>
</header>
<nav id="nav" aria-label="状态筛选"></nav>
<div class="sec" id="mainSec">
  <h2>在办任务 <span class="sub" id="mainSub"></span></h2>
  <div class="rows" id="rows"></div>
</div>
<div class="sec" id="archSec">
  <div class="arch" id="arch">
    <button class="arch-toggle" onclick="document.getElementById('arch').classList.toggle('open')" aria-expanded="false">
      <h2>归档区</h2><span class="sub" id="archSub"></span><span class="arr">&#9654;</span>
    </button>
    <div class="arch-body" id="archBody"></div>
  </div>
</div>
<div class="sec">
  <h2>项目 Git 动态 <span class="sub">各仓最近提交 · 活跃在前</span>
    <span class="hbtns">
      <span class="autolbl" id="git-auto">自动刷新 · 5 秒</span>
      <button class="btn-refresh" id="git-refresh-btn" title="立即刷新 Git 动态">&#10227; 手动刷新</button>
    </span>
  </h2>
  <div class="gitlist" id="gitlist"></div>
</div>
<footer>
  <span><span class="lg" style="background:var(--st-running)"></span>进行中</span>
  <span><span class="lg" style="background:var(--st-reported)"></span>待验收</span>
  <span><span class="lg" style="background:var(--st-accepted)"></span>已验收</span>
  <span><span class="lg" style="background:var(--st-failed)"></span>失败/打回</span>
  <span><span class="lg" style="background:var(--st-cancelled)"></span>已取消</span>
  <span style="margin-left:auto">蜂巢 · 终态只出自验收 · 点行开终端 · 归档区可验收/打回/续派</span>
</footer>
</div>
<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <div class="dhead">
    <span class="code" id="d-code">--</span>
    <span class="dname" id="d-name"></span>
    <span class="st" id="d-st">--</span>
    <span class="model" id="d-model" style="font-family:var(--mono);font-size:10px;color:#8B949E;border:1px solid #30363D;padding:2px 7px">--</span>
    <span id="d-sid" style="font-family:var(--mono);font-size:10px;color:#58606A"></span>
    <button class="close" id="d-close">关闭 ESC</button>
  </div>
  <div class="dgoal" id="d-goal"></div>
  <div class="dterm" id="d-term"></div>
  <div class="dfoot">
    <span id="d-follow">● 自动跟随</span>
    <span id="d-bytes">0 B</span>
    <span style="margin-left:auto">stream-json 实时流</span>
  </div>
</div>
<script type="module" src="/app.js"></script>
</body></html>
